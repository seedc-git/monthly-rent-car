name: Deploy production to Xserver

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type deploy-production after staging approval"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload root site to Xserver
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm production deployment request
        run: |
          if [ "${{ inputs.confirmation }}" != "deploy-production" ]; then
            echo "::error::Production deploy requires confirmation=deploy-production after staging approval."
            exit 1
          fi

      - name: Validate deployment secrets
        env:
          FTP_SERVER: ${{ secrets.XSERVER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.XSERVER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.XSERVER_FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.XSERVER_FTP_SERVER_DIR }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload to Xserver public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.XSERVER_FTP_SERVER }}
          username: ${{ secrets.XSERVER_FTP_USERNAME }}
          password: ${{ secrets.XSERVER_FTP_PASSWORD }}
          server-dir: ${{ secrets.XSERVER_FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            AGENTS.md
            CLAUDE.md
            .gitignore
            .DS_Store
            **/.DS_Store
