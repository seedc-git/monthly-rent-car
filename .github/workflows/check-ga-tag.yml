name: Check GA tag

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  push:
    branches:
      - staging

jobs:
  check-ga-tag:
    name: check-ga-tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Production PR requires staging confirmation
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'staging-confirmed')
        run: |
          echo "::error::Production PR is waiting for staging confirmation. Add the staging-confirmed label only after staging has been checked and the user asks for production upload."
          exit 1

      - name: Production PR changes must already be in staging
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin main staging
          git diff --binary --unified=0 origin/main..."$PR_HEAD_SHA" > /tmp/production-pr.patch
          if [ ! -s /tmp/production-pr.patch ]; then
            exit 0
          fi
          git worktree add /tmp/staging-check origin/staging
          if ! git -C /tmp/staging-check apply --reverse --check --unidiff-zero /tmp/production-pr.patch; then
            echo "::error::Production PR changes are not included in the staging branch. Apply and verify the same change on staging before merging to main."
            exit 1
          fi

      - name: Every HTML page must include the GA4 tag
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            if ! grep -q 'G-501JL6QG1N' "$f"; then
              echo "::error file=$f::GA4 tag (G-501JL6QG1N) missing"
              missing=1
            fi
          done < <(find . -name '*.html' -not -path './.git/*' -print0)
          exit $missing

      - name: SEO pages must include OGP metadata, sitemap, and robots.txt
        run: node tools/check-seo-metadata.js
