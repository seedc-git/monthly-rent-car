<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">立川駅を中心とした周辺エリア模式図</title>
  <desc id="desc">立川市と昭島市、武蔵村山市、東大和市、国分寺市、国立市、日野市のおおよその位置関係を示した模式図</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="0.54" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff3e9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#05266f" flood-opacity=".14"/>
    </filter>
    <filter id="nodeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#05266f" flood-opacity=".12"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#117bb8" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#background)"/>
  <rect width="1200" height="675" rx="32" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M120 352C305 330 432 335 588 339S892 337 1090 315" stroke="#ff8a2a" stroke-width="18" opacity=".18"/>
    <path d="M120 352C305 330 432 335 588 339S892 337 1090 315" stroke="#ff6a00" stroke-width="5"/>
    <path d="M586 335C560 252 532 183 480 105" stroke="#117bb8" stroke-width="14" opacity=".16"/>
    <path d="M586 335C560 252 532 183 480 105" stroke="#117bb8" stroke-width="4"/>
    <path d="M588 341C590 432 620 510 683 592" stroke="#0b3f92" stroke-width="14" opacity=".14"/>
    <path d="M588 341C590 432 620 510 683 592" stroke="#0b3f92" stroke-width="4"/>
    <ellipse cx="590" cy="339" rx="302" ry="226" stroke="#117bb8" stroke-width="3" stroke-dasharray="10 12" opacity=".45"/>
  </g>

  <g font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-weight="800">
    <g transform="translate(86 292)" filter="url(#nodeShadow)">
      <rect width="178" height="92" rx="24" fill="#fff" stroke="#cfe5f5" stroke-width="2"/>
      <circle cx="34" cy="30" r="10" fill="#117bb8"/>
      <text x="57" y="38" fill="#05266f" font-size="23">昭島市</text>
      <text x="28" y="69" fill="#566a84" font-size="14">立川の西側</text>
    </g>

    <g transform="translate(246 92)" filter="url(#nodeShadow)">
      <rect width="210" height="92" rx="24" fill="#fff" stroke="#cfe5f5" stroke-width="2"/>
      <circle cx="34" cy="30" r="10" fill="#117bb8"/>
      <text x="57" y="38" fill="#05266f" font-size="23">武蔵村山市</text>
      <text x="28" y="69" fill="#566a84" font-size="14">立川の北西側</text>
    </g>

    <g transform="translate(486 54)" filter="url(#nodeShadow)">
      <rect width="192" height="92" rx="24" fill="#fff" stroke="#cfe5f5" stroke-width="2"/>
      <circle cx="34" cy="30" r="10" fill="#117bb8"/>
      <text x="57" y="38" fill="#05266f" font-size="23">東大和市</text>
      <text x="28" y="69" fill="#566a84" font-size="14">立川の北側</text>
    </g>

    <g transform="translate(904 220)" filter="url(#nodeShadow)">
      <rect width="196" height="92" rx="24" fill="#fff" stroke="#cfe5f5" stroke-width="2"/>
      <circle cx="34" cy="30" r="10" fill="#117bb8"/>
      <text x="57" y="38" fill="#05266f" font-size="23">国分寺市</text>
      <text x="28" y="69" fill="#566a84" font-size="14">立川の東側</text>
    </g>

    <g transform="translate(874 416)" filter="url(#nodeShadow)">
      <rect width="190" height="92" rx="24" fill="#fff" stroke="#cfe5f5" stroke-width="2"/>
      <circle cx="34" cy="30" r="10" fill="#117bb8"/>
      <text x="57" y="38" fill="#05266f" font-size="23">国立市</text>
      <text x="28" y="69" fill="#566a84" font-size="14">立川の南東側</text>
    </g>

    <g transform="translate(598 533)" filter="url(#nodeShadow)">
      <rect width="184" height="92" rx="24" fill="#fff" stroke="#cfe5f5" stroke-width="2"/>
      <circle cx="34" cy="30" r="10" fill="#117bb8"/>
      <text x="57" y="38" fill="#05266f" font-size="23">日野市</text>
      <text x="28" y="69" fill="#566a84" font-size="14">多摩川の南側</text>
    </g>
  </g>

  <g transform="translate(448 240)" filter="url(#shadow)">
    <rect width="286" height="196" rx="38" fill="#05266f"/>
    <path d="M142 34c-39 0-70 31-70 70 0 52 70 103 70 103s70-51 70-103c0-39-31-70-70-70Z" fill="#ff6a00"/>
    <circle cx="142" cy="103" r="30" fill="#fff"/>
    <text x="142" y="94" text-anchor="middle" fill="#05266f" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="24" font-weight="900">立川駅</text>
    <text x="142" y="129" text-anchor="middle" fill="#05266f" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="17" font-weight="800">中心</text>
    <text x="142" y="174" text-anchor="middle" fill="#fff" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="20" font-weight="900">立川市</text>
  </g>

  <g font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-weight="900">
    <g transform="translate(82 560)">
      <rect width="324" height="68" rx="20" fill="#fff" stroke="#cfe5f5" stroke-width="2"/>
      <line x1="22" y1="25" x2="74" y2="25" stroke="#ff6a00" stroke-width="5" stroke-linecap="round"/>
      <text x="90" y="31" fill="#05266f" font-size="16">JR中央線（東西方向）</text>
      <line x1="22" y1="47" x2="74" y2="47" stroke="#117bb8" stroke-width="4" stroke-linecap="round"/>
      <text x="90" y="53" fill="#566a84" font-size="14">周辺路線・幹線のイメージ</text>
    </g>
  </g>

  <text x="1110" y="642" text-anchor="end" fill="#566a84" font-family="'Hiragino Sans','Yu Gothic',sans-serif" font-size="14" font-weight="700">※位置関係を分かりやすく示した模式図です（縮尺・経路は実測ではありません）</text>
</svg>
